*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent2)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(14,16,19,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--text)}
.logo span{color:var(--accent2)}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--text)}
select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.95rem}
.hero{text-align:center;padding:36px 16px 50px}
.frame{position:relative;border-radius:14px;overflow:hidden}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;box-shadow:inset 0 0 22px 6px rgba(0,55,166,.9)}
.cover{width:720px;max-width:100%;margin:0 auto 96px;position:relative}
.cover .frame img{width:100%;display:block}
.avatar{position:absolute;left:50%;bottom:-78px;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;padding:6px;background:var(--bg);border:7px solid var(--accent);box-shadow:0 0 0 2px var(--accent2),0 6px 18px rgba(0,0,0,.6);object-fit:cover;z-index:2}
.hero h1{font-size:clamp(2.6rem,9vw,4.8rem);margin:0;letter-spacing:-2px}
.hero h1 span{color:var(--accent2)}
.hero p{font-size:1.15rem;max-width:600px;margin:10px auto 26px;color:#e3e3e3}
.btn{display:inline-block;background:var(--sheen);color:#fff;font-weight:700;padding:13px 24px;border-radius:10px;text-decoration:none;border:0;cursor:pointer;font-size:1rem}
.socials{display:flex;flex-wrap:wrap;gap:10px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
main{max-width:980px;margin:0 auto;padding:10px 16px 50px}
section{padding:46px 0;border-bottom:1px solid var(--line)}
h2{font-size:1.7rem;margin:0 0 16px}
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:28px;align-items:center}
.about figure{margin:0}.about img{width:100%;display:block}
.back{text-align:center;margin:0 0 10px;font-size:clamp(2.4rem,7vw,3.8rem);font-weight:900;letter-spacing:4px;line-height:1;color:var(--accent2);text-shadow:0 3px 10px rgba(0,55,166,.6)}
.story p{margin:0 0 14px}.more{display:inline-block;margin-top:8px;font-weight:700}
.nick{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:40px 12px 80px;text-align:center;font-size:clamp(2.5rem,6.8vw,3.8rem);line-height:1.1;font-weight:900;font-style:italic;color:var(--accent2);-webkit-text-stroke:1px #fff;text-shadow:0 2px 8px rgba(0,0,0,.8);background:linear-gradient(transparent,rgba(0,55,166,.55))}
@media(max-width:720px){.about{grid-template-columns:1fr}nav{display:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;font-weight:600}
.note{color:var(--muted);margin-top:16px}
.plat{display:flex;flex-direction:column;gap:10px}.plat b{font-size:1.2rem}.plat span{color:var(--muted);font-weight:400}.plat .btn{text-align:center;margin-top:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;cursor:pointer;display:block}
h3{margin:22px 0 10px;color:var(--accent2)}
.evs{display:grid;gap:8px}.ev{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.ev time{font-weight:800;color:var(--accent2);min-width:96px}.ev small{color:var(--muted);display:block}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form .full{grid-column:1/-1}
@media(max-width:720px){form{grid-template-columns:1fr}}
label{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}
input,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:120px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:72vh;border-radius:8px}
.lb .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.lb .acts a,.lb .acts button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;text-decoration:none;font:inherit;cursor:pointer}
.lb .x{position:absolute;top:12px;right:16px;font-size:2rem;background:none;border:0;color:#fff;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:28px 16px}
</style>

es:{back:"¡VUELVE!",story_h:"Mi historia",story_link:"Leer mi historia →",
st1:"Mi historia con la fotografía empezó de niño, con una Petri Racer que todavía conservo. No sabía usarla y muchas fotos salían mal, pero no paraba de disparar. Después llegaron las cámaras de carrete automáticas y, con ellas, mis primeras fotos de verdad: ahí supe que esto lo llevaba dentro.",
st2:"Con los años entré en el mundo motero. Las cámaras compactas no aguantaban el ritmo ni me dejaban hacer las fotos que tenía en la cabeza, así que di el salto a una Canon 450D y, más tarde, a la 7D con el 28-300 L. Entre 2008 y 2012 me hice un nombre en la escena motera canaria fotografiando las motos desde dentro de la cuneta, tumbado a ras de suelo en plena curva. Una técnica arriesgada, no sin algún susto, que me valió el apodo de «el niño de la curva».",
st3:"En 2014 la vida me llevó por otros caminos y me despedí de mi equipo. Años después, buscando una cámara de segunda mano, me pusieron en las manos una 7D… y la reconocí: era la mía, con el soporte que yo mismo le había pegado en la pantalla. Lo tomé como una señal. Hoy he vuelto a lo que siempre me ha apasionado: congelar la acción al aire libre, con luz natural."},
en:{back:"HE'S BACK!",story_h:"My story",story_link:"Read my story →",
st1:"My story with photography began as a kid, with a Petri Racer I still keep. I didn't know how to use it and many shots came out wrong, but I never stopped shooting. Then came automatic film cameras and, with them, my first real photos: that's when I knew this was in my blood.",
st2:"Over the years I got into the motorcycle world. Compact cameras couldn't keep up or let me take the pictures I had in mind, so I moved up to a Canon 450D and later to the 7D with the 28-300 L. Between 2008 and 2012 I made a name for myself in the Canary Islands biker scene by shooting bikes from inside the roadside ditch, lying at ground level in the middle of the bend. A risky technique, with the odd scare along the way, that earned me the nickname \"el niño de la curva\" (the curve kid).",
st3:"In 2014 life took me down other roads and I said goodbye to my gear. Years later, looking for a second-hand camera, someone handed me a 7D… and I recognised it: it was mine, with the mount I had glued onto the screen myself. I took it as a sign. Today I'm back doing what I've always loved: freezing the action outdoors, in natural light."},
pt:{back:"VOLTOU!",story_h:"Minha história",story_link:"Ler minha história →",
st1:"Minha história com a fotografia começou na infância, com uma Petri Racer que ainda guardo. Eu não sabia usá-la e muitas fotos saíam ruins, mas não parava de fotografar. Depois vieram as câmeras automáticas de filme e, com elas, minhas primeiras fotos de verdade: ali eu soube que isso estava no meu sangue.",
st2:"Com os anos, entrei no mundo das motos. As câmeras compactas não aguentavam o ritmo nem me deixavam fazer as fotos que eu imaginava, então dei o salto para uma Canon 450D e, depois, para a 7D com a 28-300 L. Entre 2008 e 2012 fiz meu nome na cena motociclística das Canárias fotografando as motos de dentro da valeta, deitado rente ao chão, bem no meio da curva. Uma técnica arriscada, com alguns sustos pelo caminho, que me rendeu o apelido \"el niño de la curva\" (o menino da curva).",
st3:"Em 2014 a vida me levou por outros caminhos e me despedi do meu equipamento. Anos depois, procurando uma câmera usada, me colocaram uma 7D nas mãos… e eu a reconheci: era a minha, com o suporte que eu mesmo tinha colado na tela. Encarei como um sinal. Hoje voltei ao que sempre me apaixonou: congelar a ação ao ar livre, com luz natural."},
ru:{back:"ВЕРНУЛСЯ!",story_h:"Моя история",story_link:"Читать мою историю →",
st1:"Моя история с фотографией началась в детстве, с камеры Petri Racer, которую я храню до сих пор. Я не умел ей пользоваться, и многие снимки выходили неудачными, но я не переставал снимать. Потом появились автоматические плёночные камеры, а с ними — мои первые настоящие фотографии: тогда я понял, что это у меня в крови.",
st2:"Со временем я попал в мир мотоциклов. Компактные камеры не выдерживали темпа и не позволяли делать снимки, которые я задумывал, поэтому я перешёл на Canon 450D, а затем на 7D с объективом 28-300 L. С 2008 по 2012 год я стал известен в мотосообществе Канарских островов благодаря снимкам мотоциклов из кювета: я лежал на уровне земли прямо в середине поворота. Рискованная техника, не обошлось и без испугов, но именно она принесла мне прозвище \"el niño de la curva\" («парень из поворота»).",
st3:"В 2014 году жизнь повела меня другими путями, и я расстался со своей техникой. Спустя годы, подыскивая подержанную камеру, я взял в руки 7D… и узнал её: это была моя, с креплением, которое я сам приклеил к экрану. Я принял это как знак. Сегодня я вернулся к тому, что всегда любил: ловить движение на открытом воздухе при естественном свете."},
de:{back:"IST ZURÜCK!",story_h:"Meine Geschichte",story_link:"Meine Geschichte lesen →",
st1:"Meine Geschichte mit der Fotografie begann als Kind, mit einer Petri Racer, die ich noch heute besitze. Ich wusste nicht, wie man sie bedient, und viele Bilder misslangen, aber ich hörte nie auf zu fotografieren. Dann kamen die automatischen Filmkameras und mit ihnen meine ersten richtig guten Fotos: Da wusste ich, dass mir das im Blut liegt.",
st2:"Mit den Jahren kam ich in die Motorradszene. Kompaktkameras hielten nicht mit und ließen mich nicht die Bilder machen, die ich im Kopf hatte, also stieg ich auf eine Canon 450D um und später auf die 7D mit dem 28-300 L. Zwischen 2008 und 2012 machte ich mir in der kanarischen Motorradszene einen Namen, indem ich die Maschinen aus dem Straßengraben fotografierte – auf Bodenhöhe liegend, mitten in der Kurve. Eine riskante Technik, nicht ohne den einen oder anderen Schreck, die mir den Spitznamen \"el niño de la curva\" (der Junge aus der Kurve) einbrachte.",
st3:"2014 führte mich das Leben auf andere Wege, und ich verabschiedete mich von meiner Ausrüstung. Jahre später, auf der Suche nach einer gebrauchten Kamera, drückte man mir eine 7D in die Hand … und ich erkannte sie: Es war meine, mit der Halterung, die ich selbst auf den Bildschirm geklebt hatte. Ich nahm es als Zeichen. Heute bin ich zurück bei dem, was ich schon immer geliebt habe: Action draußen festhalten, mit natürlichem Licht."},
fr:{back:"EST DE RETOUR !",story_h:"Mon histoire",story_link:"Lire mon histoire →",
st1:"Mon histoire avec la photographie a commencé quand j'étais enfant, avec un Petri Racer que je garde encore. Je ne savais pas m'en servir et beaucoup de photos étaient ratées, mais je n'arrêtais jamais de déclencher. Puis sont arrivés les appareils argentiques automatiques et, avec eux, mes premières vraies photos : j'ai compris que je l'avais dans le sang.",
st2:"Avec les années, je suis entré dans le monde de la moto. Les compacts ne suivaient pas le rythme et ne me permettaient pas de faire les photos que j'avais en tête, alors je suis passé à un Canon 450D, puis au 7D avec le 28-300 L. Entre 2008 et 2012, je me suis fait un nom dans le milieu motard des Canaries en photographiant les motos depuis le fossé, allongé au ras du sol, en plein virage. Une technique risquée, non sans quelques frayeurs, qui m'a valu le surnom de \"el niño de la curva\" (le gamin du virage).",
st3:"En 2014, la vie m'a mené sur d'autres chemins et j'ai dit adieu à mon matériel. Des années plus tard, en cherchant un appareil d'occasion, on m'a mis un 7D entre les mains… et je l'ai reconnu : c'était le mien, avec le support que j'avais moi-même collé sur l'écran. Je l'ai pris comme un signe. Aujourd'hui, je suis revenu à ce qui m'a toujours passionné : figer l'action en plein air, en lumière naturelle."},
it:{back:"È TORNATO!",story_h:"La mia storia",story_link:"Leggi la mia storia →",
st1:"La mia storia con la fotografia è iniziata da bambino, con una Petri Racer che conservo ancora. Non sapevo usarla e molte foto venivano male, ma non smettevo mai di scattare. Poi sono arrivate le macchine automatiche a pellicola e, con loro, le mie prime vere foto: lì ho capito che ce l'avevo nel sangue.",
st2:"Con gli anni sono entrato nel mondo delle moto. Le compatte non reggevano il ritmo né mi permettevano di fare le foto che avevo in mente, così sono passato a una Canon 450D e poi alla 7D con il 28-300 L. Tra il 2008 e il 2012 mi sono fatto un nome nella scena motociclistica delle Canarie fotografando le moto da dentro il fosso, sdraiato a livello del suolo, in piena curva. Una tecnica rischiosa, non senza qualche spavento, che mi è valsa il soprannome \"el niño de la curva\" (il ragazzo della curva).",
st3:"Nel 2014 la vita mi ha portato su altre strade e ho detto addio alla mia attrezzatura. Anni dopo, cercando una fotocamera usata, mi hanno messo in mano una 7D… e l'ho riconosciuta: era la mia, con il supporto che avevo incollato io stesso sullo schermo. L'ho preso come un segno. Oggi sono tornato a ciò che mi ha sempre appassionato: congelare l'azione all'aperto, con luce naturale."},
pl:{back:"WRACA!",story_h:"Moja historia",story_link:"Przeczytaj moją historię →",
st1:"Moja przygoda z fotografią zaczęła się w dzieciństwie, od aparatu Petri Racer, który wciąż mam. Nie umiałem go obsługiwać i wiele zdjęć wychodziło źle, ale nie przestawałem fotografować. Potem przyszły automatyczne aparaty na kliszę, a z nimi moje pierwsze prawdziwe zdjęcia: wtedy wiedziałem, że mam to we krwi.",
st2:"Z czasem wszedłem w świat motocykli. Kompakty nie nadążały i nie pozwalały mi robić zdjęć, które miałem w głowie, więc przesiadłem się na Canona 450D, a później na 7D z obiektywem 28-300 L. W latach 2008–2012 wyrobiłem sobie nazwisko w kanaryjskim środowisku motocyklowym, fotografując motocykle z wnętrza przydrożnego rowu, leżąc na poziomie ziemi w samym środku zakrętu. Ryzykowna technika, nie bez kilku strachów, która przyniosła mi przydomek \"el niño de la curva\" (chłopak z zakrętu).",
st3:"W 2014 roku życie poprowadziło mnie innymi drogami i pożegnałem się ze sprzętem. Lata później, szukając używanego aparatu, dostałem do rąk 7D… i rozpoznałem go: był mój, z uchwytem, który sam przykleiłem do ekranu. Uznałem to za znak. Dziś wróciłem do tego, co zawsze kochałem: zatrzymywania akcji w plenerze, w naturalnym świetle."},
ro:{back:"SE ÎNTOARCE!",story_h:"Povestea mea",story_link:"Citește povestea mea →",
st1:"Povestea mea cu fotografia a început în copilărie, cu un Petri Racer pe care îl păstrez și azi. Nu știam să-l folosesc și multe poze ieșeau prost, dar nu mă opream din fotografiat. Apoi au venit aparatele automate cu film și, odată cu ele, primele mele fotografii adevărate: atunci am știut că o am în sânge.",
st2:"Cu anii, am intrat în lumea motocicletelor. Aparatele compacte nu țineau pasul și nu mă lăsau să fac pozele pe care le aveam în minte, așa că am trecut la un Canon 450D și, mai târziu, la 7D cu 28-300 L. Între 2008 și 2012 mi-am făcut un nume în comunitatea motocicliștilor din Canare fotografiind motocicletele din interiorul șanțului, întins la nivelul solului, chiar în mijlocul curbei. O tehnică riscantă, nu fără câteva sperieturi, care mi-a adus porecla \"el niño de la curva\" (băiatul din curbă).",
st3:"În 2014 viața m-a dus pe alte drumuri și mi-am luat rămas bun de la echipament. Ani mai târziu, căutând un aparat la mâna a doua, mi s-a pus în mâini un 7D… și l-am recunoscut: era al meu, cu suportul pe care îl lipisem chiar eu pe ecran. Am luat-o ca pe un semn. Astăzi m-am întors la ceea ce m-a pasionat dintotdeauna: să surprind acțiunea în aer liber, în lumină naturală."},
nl:{back:"IS TERUG!",story_h:"Mijn verhaal",story_link:"Lees mijn verhaal →",
st1:"Mijn verhaal met fotografie begon als kind, met een Petri Racer die ik nog steeds heb. Ik wist niet hoe ik hem moest gebruiken en veel foto's mislukten, maar ik bleef fotograferen. Daarna kwamen de automatische filmcamera's en daarmee mijn eerste echte foto's: toen wist ik dat het in mijn bloed zat.",
st2:"In de loop der jaren kwam ik in de motorwereld terecht. Compactcamera's konden het tempo niet bijhouden en lieten me niet de foto's maken die ik in mijn hoofd had, dus stapte ik over op een Canon 450D en later op de 7D met de 28-300 L. Tussen 2008 en 2012 maakte ik naam in de Canarische motorscene door motoren te fotograferen vanuit de berm, liggend op grondniveau, midden in de bocht. Een riskante techniek, niet zonder een paar schrikmomenten, die me de bijnaam \"el niño de la curva\" (de jongen uit de bocht) opleverde.",
st3:"In 2014 bracht het leven me op andere wegen en nam ik afscheid van mijn uitrusting. Jaren later, op zoek naar een tweedehands camera, kreeg ik een 7D in handen… en ik herkende hem: het was de mijne, met de houder die ik zelf op het scherm had geplakt. Ik zag het als een teken. Vandaag ben ik terug bij wat ik altijd geweldig vond: actie buiten vastleggen, met natuurlijk licht."}
};
for(const k in N3)Object.assign(T[k],N3[k]);
/* Eventos: se leen del archivo eventos.txt */
let EVENTS=[];
function renderEvents(){const today=new Date().toISOString().slice(0,10);
 const fmt=d=>{try{return new Date(d+'T12:00').toLocaleDateString(L,{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
 const fill=(id,arr)=>{const el=document.getElementById(id);el.innerHTML=arr.length?arr.map(e=>'<div class="ev"><time>'+fmt(e.d)+'</time><div>'+e.n+'<small>'+e.p+'</small></div></div>').join(''):'<div class="empty">'+T[L].ev_none+'</div>'};
 fill('ev_next',EVENTS.filter(e=>e.d>=today).sort((a,b)=>a.d<b.d?-1:1));
 fill('ev_done',EVENTS.filter(e=>e.d<today).sort((a,b)=>a.d<b.d?1:-1));}
function parseEvents(t){EVENTS=t.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{const[d,n,p]=l.split('|').map(s=>(s||'').trim().replace(/[<>]/g,''));return{d,n,p}}).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.d));renderEvents();}
fetch('eventos.txt').then(r=>r.ok?r.text():'').then(parseEvents).catch(()=>parseEvents(''));
const plats=document.getElementById('plats');
function renderPlats(){plats.innerHTML='';PLATFORMS.forEach(p=>{const d=document.createElement('div');d.className='card plat';
 d.innerHTML='<b>'+p.name+'</b><span>'+T[L][p.type]+'</span><a class="btn" target="_blank" rel="noopener" href="'+p.url+'">'+T[L].find_btn+'</a>';plats.appendChild(d)})}
const sel=document.getElementById('lang');let L='es';
function setLang(l){L=T[l]?l:'en';document.documentElement.lang=L;sel.value=L;
 document.querySelectorAll('[data-i]').forEach(e=>{const v=T[L][e.dataset.i];if(v)e.textContent=v});
 try{localStorage.setItem('lang',L)}catch(e){} renderEmpty();renderPlats();if(typeof renderEvents=='function')renderEvents();}
let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
const nav=(navigator.language||'es').slice(0,2);
sel.onchange=()=>setLang(sel.value);
document.getElementById('y').textContent=new Date().getFullYear();

/* Tablón: lee la carpeta "galeria" del repositorio de GitHub */
const REPO='franchumc-ui/frankyphoto';let photos=[];
const grid=document.getElementById('grid');
function renderEmpty(){if(!photos.length)grid.innerHTML='<div class="empty">'+T[L].gal_empty+'</div>'}
fetch('https://api.github.com/repos/'+REPO+'/contents/galeria')
 .then(r=>r.ok?r.json():[]).then(list=>{
  photos=(Array.isArray(list)?list:[]).filter(f=>/\.(jpe?g|png|webp)$/i.test(f.name)).map(f=>f.name).sort().reverse();
  if(!photos.length)return renderEmpty();
  grid.innerHTML='';photos.forEach(n=>{const i=document.createElement('img');i.src='galeria/'+encodeURIComponent(n);i.alt=n;i.loading='lazy';i.onclick=()=>openLb(n);grid.appendChild(i)});
  const m=location.hash.match(/^#foto=(.+)$/);if(m)openLb(decodeURIComponent(m[1]));
 }).catch(renderEmpty);

const lb=document.getElementById('lb');
function openLb(n){const img=new URL('galeria/'+encodeURIComponent(n),location.href).href;
 const link=location.origin+location.pathname+'#foto='+encodeURIComponent(n);const u=encodeURIComponent(link);
 document.getElementById('lbimg').src=img;
 sh_fb.href='https://www.facebook.com/sharer/sharer.php?u='+u;
 sh_wa.href='https://wa.me/?text='+encodeURIComponent('FrankyPhoto · '+link);
 sh_x.href='https://twitter.com/intent/tweet?text=FrankyPhoto&url='+u;
 sh_pin.href='https://pinterest.com/pin/create/button/?url='+u+'&media='+encodeURIComponent(img);
 sh_dl.href=img;sh_dl.setAttribute('download',n);
 sh_cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(link);sh_cp.textContent=T[L].copied;setTimeout(()=>sh_cp.textContent=T[L].copy,1500)};
 lb.classList.add('on');history.replaceState(null,'','#foto='+encodeURIComponent(n));}
document.getElementById('lbx').onclick=()=>{lb.classList.remove('on');history.replaceState(null,'',location.pathname)};

/* Formulario de presupuesto: abre el correo con el mensaje preparado */
document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
 const body=['Nombre: '+f.get('name'),'Email: '+f.get('email'),'Evento: '+f.get('type'),'Fecha: '+f.get('date'),'Lugar: '+f.get('place'),'','Mensaje:',f.get('msg'),'','Idioma web: '+L].join('\n');
 location.href='mailto:franchumc@gmail.com?subject='+encodeURIComponent('Presupuesto FrankyPhoto - '+f.get('name'))+'&body='+encodeURIComponent(body);};

setLang(saved||(T[nav]?nav:'en'));
</script>
